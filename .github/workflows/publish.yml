# Publicação no GHCR só depois do CI do mesmo sha.
# publish.yml não consegue usar needs de um job do ci.yml. O gate é
# workflow_run: o push no main dispara o CI e, com conclusion success,
# este workflow publica. workflow_dispatch no main só segue se a API
# mostrar o CI daquele sha com success (actions: read, sem segredo extra).
# No pull_request há build e smoke, sem login e sem push.
name: publish

on:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      publish: ${{ steps.meta.outputs.publish }}
      built: ${{ steps.meta.outputs.built }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Sha e se este job pode publicar
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            publish=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            sha="${{ github.sha }}"
            if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              echo "workflow_dispatch só publica a partir do main" >&2
              exit 1
            fi
            ok="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=success&per_page=1" --jq '.total_count')"
            if [[ "$ok" == "0" ]]; then
              echo "CI do sha ${sha} não está success; nada é publicado" >&2
              exit 1
            fi
            publish=true
          else
            sha="${{ github.event.pull_request.head.sha }}"
            publish=false
          fi
          test "$(printf '%s' "$sha" | wc -c)" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build local para o smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          load: true
          push: false
          provenance: false
          sbom: false
          tags: barberclub:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Smoke /api/health/live em até 30s
        run: bash scripts/smoke-image.sh barberclub:smoke "${{ steps.meta.outputs.sha }}"

  push:
    needs: smoke
    if: needs.smoke.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.smoke.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publica sha e latest
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/daniloalmeid/barberclub:${{ needs.smoke.outputs.sha }}
            ghcr.io/daniloalmeid/barberclub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_COMMIT=${{ needs.smoke.outputs.sha }}
            BUILD_TIME=${{ needs.smoke.outputs.built }}
          labels: |
            org.opencontainers.image.revision=${{ needs.smoke.outputs.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
