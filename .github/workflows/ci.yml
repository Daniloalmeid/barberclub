name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:locks
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instalar Supabase CLI 3.2.0
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v3.2.0/supabase_linux_amd64.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/supabase.tar.gz
          supabase --version
      - name: Subir Postgres local e aplicar migrations
        run: supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Grants que só o supabase_admin consegue
        run: bash scripts/apply-superuser-grants.sh
      - name: pgTAP T01–T26 e G01–G13
        run: supabase test db supabase/tests/pgtap
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Concorrência C01–C08
        run: pnpm exec tsx supabase/tests/concurrency/run.ts
