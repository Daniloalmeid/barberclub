version: 1
protocol: |
  Cada tarefa declara os caminhos que vai tocar.
  Quem não é o dono da trava não edita esses caminhos.
  O Hermes não toca em caminho travado pelo Grok e vice-versa.
  Os quatro artefatos canônicos da VPS não entram neste repositório.
  Mudança neles só por patch sobre o arquivo existente, aplicado pelo Hermes.

tasks:
  - id: m1-fundacao
    owner: grok
    milestone: M1
    paths:
      - apps/**
      - packages/**
      - supabase/**
      - .github/**
      - ops/locks.yml
      - docs/**
      - infra/**
      - scripts/**
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - turbo.json
      - tsconfig.base.json
      - Dockerfile
      - .gitignore
      - README.md
  - id: m4-tenant-host
    owner: grok
    milestone: M4
    paths:
      - apps/web/**
      - packages/config/**
      - packages/core/**
      - supabase/migrations/**
      - supabase/tests/**
      - docs/m4-arquitetura.md
      - docs/hermes-m4.md
      - docs/decisoes-m4.md
      - scripts/check-path-http.mjs
      - scripts/check-host-http.mjs
      - scripts/check-reserved-sync.mjs
      - scripts/gen-reserved-slugs-sql.mjs
      - scripts/test-slug-migration.sh
      - scripts/diagnose-tenant-slugs.sql
      - scripts/stub-postgrest.mjs
      - scripts/check-login-http.mjs
      - scripts/check-login-http.sh
      - scripts/check-dump-counts.sh
      - .github/workflows/ci.yml
      - ops/locks.yml

vps_canonical:
  - path: /opt/workloop/barberclub/scripts/backup-daily.sh
    role: backup diário oficial
  - path: /opt/workloop/barberclub/scripts/traefik-drift-check.sh
    role: detector de deriva oficial
  - path: /opt/workloop/barberclub/runbooks/traefik-window.md
    role: runbook oficial da janela do Traefik
  - path: /opt/workloop/barberclub/env/backup.env.example
    role: modelo oficial das variáveis do backup, sem segredos
